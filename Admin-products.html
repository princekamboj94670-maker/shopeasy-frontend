<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Products</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h1>🛒 ShopEasy Product Manager</h1>

<input type="text" id="name" placeholder="Product Name"><br><br>

<input type="number" id="price" placeholder="Price"><br><br>

<input type="text" id="image" placeholder="Image URL"><br><br>

<textarea id="description" placeholder="Description"></textarea><br><br>

<select id="category">
  <option value="mobiles">Mobiles</option>
  <option value="laptops">Laptops</option>
  <option value="fashion">Fashion</option>
  <option value="electronics">Electronics</option>
</select><br><br>

<button id="addProduct">➕ Add Product</button>

<hr>

<h2>All Products</h2>

<div id="products"></div>

<script type="module" src="admin-products.js"></script>

</body>
</html>
